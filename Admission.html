<section>
    <h2>Student Admission Form</h2>
<h3>Apply For Admission</h3>
<p>Please complete the form with your information.</p>

<form action="">
        <label for="">Full Name: 
            <input type="text" name="" id="" placeholder="Enter your Full name">
        </label>
        <br>
        <br>
        <label for="">Email:
            <input type="email" name="" id="" placeholder="Enter your email"> 
        </label>   
        <br>
        <br>
        <label for="">Phone Number:
            <input type="tel" name=""  placeholder="Your Phone Number">
        </label>

        <br>
        <br>

        <label for="">Date of Birth:
        <input type="date" name="" id="">
        </label>

        <br>
        <br>

        <label for="">Gender:
            <input type="radio" name="gender"id=""> Male
            <input type="radio" name="gender"id=""> Female    
            <input type="radio" name="gender"id=""> others
        </label>

        <br>
        <br>

        <label for="">Choose Department:
            <select name="" Id="">
                <Option value="">Select Your Department</Option>
                <Option value="">CST(Computer Science and Technology)</Option>
                <Option value="">EMT(Electromedical Technology)</Option>
                <Option value="">ARCH(Architacture Technology)</Option>
                <Option value="">ENT(Electronics Technology)</Option>
            </select>
        </label>

        <br>
            <br>

        <label for="">Interests: 
            <input type="checkbox" name="interest" id=""> Travel
            <input type="checkbox" name="interest" id=""> Sports
            <input type="checkbox" name="interest" id=""> coding
        </label>

        <br> 
        <br>

        <label for="">Student photo:
            <input type="file" name="" id="">       
        </label>

        <br>
        <br>

        <label for="">Password:
            <input type="password" name="" id="" placeholder="Create a password">

        </label>

        <br>
        <br>

        <label for="">Why do you want to join?</label>
        <br>
<textarea name="" id="" placeholder="Write your message" cols="30" rows="5"></textarea>

        <br>
        <br>

        <label for="">
            <input type="checkbox"> I confirm that the information is correct.
        </label>
        <br>
        <br>

            <input type="reset" value="Reset Form">
            <input type="submit" value="Submit Application">
        </label>


</form>
</section>
